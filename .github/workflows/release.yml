name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: 发布前验证
    uses: ./.github/workflows/ci.yml

  release:
    name: 发布 macOS 与 Windows 产物
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 安装脚本取自与本次验证相同的提交：install.sh 已由 CI smoke 用假 curl 验证，install.ps1 已由 Windows smoke 验证。
      - name: 检出安装脚本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/install.sh
            scripts/install.ps1
          sparse-checkout-cone-mode: false
      - name: 下载 arm64 产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jumpdb-darwin-arm64
          path: dist
      - name: 下载 amd64 产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jumpdb-darwin-amd64
          path: dist
      - name: 下载 Windows amd64 产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jumpdb-windows-amd64
          path: dist
      - name: 下载 Windows arm64 产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jumpdb-windows-arm64
          path: dist
      - name: 生成 SHA-256 校验文件
        working-directory: dist
        run: sha256sum jumpdb-darwin-arm64.tar.gz jumpdb-darwin-amd64.tar.gz jumpdb-windows-amd64.zip jumpdb-windows-arm64.zip > SHA256SUMS
      - name: 创建并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          macOS 与 Windows 独立 CLI，运行时不依赖 Python。源码提交：$GITHUB_SHA。

          macOS 安装本版本（自动识别架构、校验 SHA256SUMS，装到 ~/.local/bin）：

              curl -fsSL https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/install.sh | JUMPDB_VERSION=$RELEASE_TAG sh

          Windows 在 PowerShell 中安装本版本（自动识别架构、校验 SHA256SUMS，装到 %LOCALAPPDATA%\Programs\jumpdb 并加入用户 PATH）：

              \$env:JUMPDB_VERSION='$RELEASE_TAG'; iex ([Text.Encoding]::UTF8.GetString((iwr -useb https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/install.ps1).Content))

          安装后运行 jumpdb --help。手动安装、升级、卸载及快速开始见 [README](https://github.com/$GH_REPO/blob/$RELEASE_TAG/README.md)。

          - Apple Silicon 下载 jumpdb-darwin-arm64.tar.gz，Intel 下载 jumpdb-darwin-amd64.tar.gz。
          - Windows 64 位：x64（Intel/AMD）下载 jumpdb-windows-amd64.zip，ARM 下载 jumpdb-windows-arm64.zip。
          - SHA256SUMS 用于校验压缩包，只能发现下载损坏，不能证明来源；每个包仅包含 jumpdb（Windows 为 jumpdb.exe）和 README.md。
          - 未做 Developer ID 签名和公证，可能受 Gatekeeper 或企业安全策略拦截；Windows 版未做代码签名，可能受 SmartScreen 或企业安全策略拦截。
          - macOS 通过双架构原生 Go 测试、race、vet、build 和本机合成 CLI smoke；Windows 通过 amd64、arm64 原生 Go 测试、vet、build 与版本输出检查（race 仅 amd64）及 install.ps1 合成 smoke，不含 CLI smoke。
          - 合成验证不代表真实门户会话、代理握手或数据库登录已通过。
          EOF
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --draft \
            --title "jumpdb $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}" dist/jumpdb-darwin-arm64.tar.gz dist/jumpdb-darwin-amd64.tar.gz \
            dist/jumpdb-windows-amd64.zip dist/jumpdb-windows-arm64.zip dist/SHA256SUMS \
            scripts/install.sh scripts/install.ps1
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
